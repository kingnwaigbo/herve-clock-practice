<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="100" fill="#0f172a"/>
  <circle cx="256" cy="256" r="210" fill="#ffffff" stroke="#e2e8f0" stroke-width="12"/>
  <!-- Ticks -->
  <line x1="256" y1="60" x2="256" y2="84" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>
  <line x1="452" y1="256" x2="428" y2="256" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>
  <line x1="256" y1="452" x2="256" y2="428" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>
  <line x1="60" y1="256" x2="84" y2="256" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>
  <!-- Hour hand -->
  <line x1="256" y1="256" x2="256" y2="150" stroke="#dc2626" stroke-width="20" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="256" y1="256" x2="350" y2="256" stroke="#2563eb" stroke-width="14" stroke-linecap="round"/>
